<title>Scanner</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #111113;
    --surface-raised: #1C1C1F;
    --line: #242428;
    --text: #F5F5F7;
    --text-dim: #8E8E93;
    --text-faint: #58585E;
    --gain: #32D74B;
    --gain-soft: #32D74B66;
    --loss: #FF453A;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 20px 16px 48px;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  .wrap { max-width: 620px; margin: 0 auto; }

  /* Header */
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .brand {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand .dot { color: var(--gain); }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .seg {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 2px;
  }
  .seg button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 0.74rem;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .seg button.active {
    background: var(--surface-raised);
    color: var(--text);
  }

  .refresh-btn {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .refresh-btn:active { transform: scale(0.92); }
  .refresh-btn:focus-visible { outline: 2px solid var(--gain); outline-offset: 2px; }
  .refresh-btn.spinning svg { animation: spin 0.6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Stat strip */
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 14px 2px 20px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat .v {
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat .v.gain { color: var(--gain); }
  .stat .l {
    font-size: 0.68rem;
    color: var(--text-faint);
  }

  .status {
    padding: 24px 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.5;
    margin-top: 18px;
  }

  .prev-toggle {
    margin-top: 18px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .prev-toggle .chev { transition: transform 0.2s ease; color: var(--text-faint); }
  .prev-toggle.open .chev { transform: rotate(180deg); }
  .prev-section { display: none; }
  .prev-section.open { display: block; }
