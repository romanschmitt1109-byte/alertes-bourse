<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scanner Bourse</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121622;
    --panel-border: #232a3b;
    --text: #e6e9f0;
    --text-dim: #9aa3b5;
    --accent: #3ddc84;
    --accent-dim: #25c56a;
    --link: #6ea8ff;
    --pill-bg: #1c2333;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f9;
      --panel: #ffffff;
      --panel-border: #e2e5ec;
      --text: #1a1d29;
      --text-dim: #5b6372;
      --accent: #0f9d58;
      --accent-dim: #0c7d46;
      --link: #1a56db;
      --pill-bg: #eef1f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header {
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .meta {
    color: var(--text-dim);
    font-size: 0.85rem;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
  }
  .status {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    color: var(--text-dim);
    font-size: 0.95rem;
  }
  .category {
    margin-top: 22px;
  }
  .category-title {
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .category-count {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .sector {
    margin: 12px 0 8px 2px;
    color: var(--text-dim);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card-name {
    font-weight: 600;
  }
  .card-ticker {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 400;
  }
  .card-stats {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .pct {
    color: var(--accent);
    font-weight: 700;
  }
  .price {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-left: 6px;
  }
  .news {
    margin-top: 8px;
    font-size: 0.88rem;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }
  .news a {
    color: var(--link);
    text-decoration: none;
  }
  .news a:hover { text-decoration: underline; }
  .news span.no-link {
    color: var(--text);
  }
  footer {
    margin-top: 28px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
  }
  .refresh-btn {
    margin-left: auto;
    background: var(--pill-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .top-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="top-row">
        <h1>🚀 Scanner Bourse</h1>
        <button class="refresh-btn" onclick="load()">Actualiser</button>
      </div>
      <div class="meta" id="meta">Chargement…</div>
    </header>

    <div id="content"></div>

    <footer>Mis à jour automatiquement à chaque scan — données Yahoo Finance.</footer>
  </div>

<script>
async function load() {
  const metaEl = document.getElementById('meta');
  const contentEl = document.getElementById('content');
  metaEl.textContent = 'Chargement…';
  contentEl.innerHTML = '';

  let data;
  try {
    const res = await fetch('data.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    metaEl.textContent = '';
    contentEl.innerHTML = '<div class="status">Impossible de charger les données (' +
      escapeHtml(String(e.message || e)) + '). Le premier scan n\'a peut-être pas encore tourné.</div>';
    return;
  }

  metaEl.innerHTML =
    '<span>Dernier scan : <strong>' + escapeHtml(data.generated_at) + '</strong></span>' +
    '<span>Seuil : +' + data.threshold_pct + '%</span>' +
    '<span>' + data.total_scanned + ' titres scannés</span>' +
    '<span>' + data.total_risers + ' en hausse</span>' +
    '<span>' + data.total_quality + ' retenu(s) après filtres</span>';

  const results = data.results || [];
  if (results.length === 0) {
    contentEl.innerHTML = '<div class="status">RAS pour ce scan : aucune action ne dépasse le seuil ' +
      '(ou aucune ne passe les filtres qualité).</div>';
    return;
  }

  // Regroupe par bourse (category) puis par secteur
  const byCategory = {};
  for (const w of results) {
    (byCategory[w.category] ||= []).push(w);
  }

  const categoryOrder = [
    "NasdaqGS", "Nasdaq Global Select",
    "NasdaqGM", "Nasdaq Global Market",
    "NasdaqCM", "Nasdaq Capital Market",
    "NYSE", "NYSE Arca", "NYSE American",
    "Cboe BZX", "Cboe US"
  ];
  const categories = Object.keys(byCategory);
  categories.sort((a, b) => {
    const ia = categoryOrder.indexOf(a), ib = categoryOrder.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  let html = '';
  for (const cat of categories) {
    const group = byCategory[cat];
    html += '<div class="category"><div class="category-title">' + escapeHtml(cat) +
      '<span class="category-count">(' + group.length + ')</span></div>';

    const bySector = {};
    for (const w of group) {
      (bySector[w.sector] ||= []).push(w);
    }
    const sectors = Object.keys(bySector).sort((a, b) => a.localeCompare(b));

    for (const sector of sectors) {
      const items = bySector[sector].slice().sort((a, b) =>
        (a.name || a.ticker).toLowerCase().localeCompare((b.name || b.ticker).toLowerCase())
      );
      html += '<div class="sector">' + escapeHtml(sector) + '</div>';
      for (const w of items) {
        html += '<div class="card">' +
          '<div class="card-top">' +
            '<div class="card-name">' + escapeHtml(w.name || w.ticker) +
              ' <span class="card-ticker">(' + escapeHtml(w.ticker) + ')</span></div>' +
            '<div class="card-stats"><span class="pct">+' + w.pct_change + '%</span>' +
              '<span class="price">' + w.price + '$</span></div>' +
          '</div>';
        if (w.news && w.news.title) {
          html += '<div class="news">📰 ' + (w.news.link
            ? '<a href="' + escapeAttr(w.news.link) + '" target="_blank" rel="noopener">' + escapeHtml(w.news.title) + '</a>'
            : '<span class="no-link">' + escapeHtml(w.news.title) + '</span>') + '</div>';
        }
        html += '</div>';
      }
    }
    html += '</div>';
  }

  contentEl.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHtml(str).replaceAll('"', '&quot;');
}

load();
</script>
</body>
</html>
