name: Radar des initiés (SEC, tout le marché)

on:
  schedule:
    # Toutes les 30 minutes en semaine (UTC), plus un passage la nuit pour les dépôts tardifs
    - cron: "20,50 6-23 * * 1-5"
    - cron: "20 3 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: insiders
  cancel-in-progress: false

jobs:
  insiders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Lire les formulaires 4
        env:
          # La SEC exige un nom + une adresse e-mail de contact pour les programmes automatiques
          SEC_USER_AGENT: "AlertesBourse romansgk1109@gmail.com"
        run: python insiders.py

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/insiders.json data/insiders_state.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour du radar des initiés"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
