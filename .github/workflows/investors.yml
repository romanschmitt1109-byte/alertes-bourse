name: Suivi des investisseurs (SEC)

on:
  schedule:
    # Toutes les 30 minutes en semaine, de 8h à 23h (UTC)
    - cron: "*/30 6-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: investors
  cancel-in-progress: false

jobs:
  investors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Récupérer les mouvements
        run: python investors.py

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/investors.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des mouvements d'investisseurs"
            git pull --rebase origin main || true
            git push
          fi
