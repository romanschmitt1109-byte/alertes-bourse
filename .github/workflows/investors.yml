name: Suivi des investisseurs (SEC)

on:
  schedule:
    # Toutes les 30 minutes en semaine, de 8h à 23h (UTC)
    - cron: "*/30 6-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: investors
  cancel-in-progress: false

jobs:
  investors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Récupérer les mouvements
        env:
          # La SEC exige un nom + une adresse e-mail de contact pour les programmes automatiques
          SEC_USER_AGENT: "AlertesBourse romansgk1109@gmail.com"
        run: python investors.py

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/investors.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des mouvements d'investisseurs"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
