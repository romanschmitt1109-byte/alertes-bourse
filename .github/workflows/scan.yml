name: Alerte hausses +10% (NASDAQ complet + S&P 500)

on:
  schedule:
    # Scans toutes les heures pendant les heures de marché US (9h30-16h ET)
    # 14h30-20h30 UTC couvre approximativement la session, hiver et été confondus
    # (le marché ouvre/ferme donc parfois 1h plus tôt/tard selon l'heure d'été - acceptable)
    - cron: "30 14-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write  # nécessaire pour committer docs/data.json

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # le scan de ~6000-7000 titres peut prendre du temps
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install yfinance pandas requests lxml deep-translator

      - name: Lancer le scan
        run: python scanner.py

      - name: Publier les résultats sur le site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Mise à jour des résultats du scan"
            git push
          fi
